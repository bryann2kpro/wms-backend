name: Deploy

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PROJECT_NAME: smee-backend
      DOCKERHUB_NAMESPACE: gremoryyx

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            VERSION="0.0.0-$SHORT_SHA"
          else
            VERSION="${TAG#v}"
          fi

          IMAGE="${DOCKERHUB_NAMESPACE}/${PROJECT_NAME}"
          REF_NAME="${GITHUB_REF_NAME}"

          TAGS=""
          if [ "$REF_NAME" = "main" ]; then
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [ "$REF_NAME" = "staging" ]; then
            TAGS="${IMAGE}:staging-${VERSION},${IMAGE}:staging-latest"
          else
            # For pull_request events, GITHUB_REF_NAME is the PR's branch name.
            # Still compute a deterministic tag for build validation, but never push.
            TAGS="${IMAGE}:${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push on branch pushes)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
