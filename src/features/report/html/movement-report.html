<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement Report</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-6">
    <h1 class="text-2xl font-bold mb-2">Movement Report</h1>
    <p class="text-gray-600 mb-4">
        Period: <strong>{{dateFrom}}</strong> to <strong>{{dateTo}}</strong>
    </p>
    <div class="overflow-x-auto rounded-lg border">
        <div class="relative w-full overflow-x-auto">
            <table class="w-full caption-bottom text-sm">
                <thead class="[&_tr]:border-b">
                    <tr class="hover:bg-muted/50 data-[state=selected]:bg-muted border-b transition-colors">
                        <th class="text-foreground h-10 px-2 text-left align-middle font-medium whitespace-nowrap [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">Item Code</th>
                        <th class="text-foreground h-10 px-2 text-left align-middle font-medium whitespace-nowrap [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">Description</th>
                        <th class="text-foreground h-10 px-2 text-left align-middle font-medium whitespace-nowrap [&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px]">Count Adjustment Unit Qty</th>
                    </tr>
                </thead>
                <tbody class="[&_tr:last-child]:border-0">
                    {{tableRegionHeader}}
                    {{tableRows}}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
